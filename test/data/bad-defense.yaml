# A Defense of four values, and the Defense override keys where they
# don't belong: defense-2 on an Ability, barrier (defense-2's old name)
# on an attack, and a defense-4 that doesn't exist.  Each is a recorded
# error, so all four are reported.
- name: Bad Defense
  abilities:
    - name: Quick
      level: 1
      overrides: [defense-2]
  combat:
    defense: 2/3/4/5
    health: 40
    endurance: 40
    overrides: [barrier, defense-3, defense-4]
    attacks:
      - name: Hit
        roll: 1
        dx: 1
        endurance: 0
        overrides: [barrier]
