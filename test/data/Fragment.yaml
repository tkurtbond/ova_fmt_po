# Fragment.yaml -- transcribed from the rulebook's own "NPC Fragments"
# section (p. 142), which uses the minor-NPC format ova_fmt's
# fragment: true marker renders (PLAN.md's optional-vs-required
# audit). Game-mechanical data (Ability/Weakness names and Levels) is
# transcribed faithfully; the short one-paragraph descriptions are
# original paraphrases, the same as Shady-Teacher.yaml's and
# Snobbish-Upperclassman.yaml's (see Karis.yaml's header comment for
# the general copyright-conscious transcription policy this follows).
#
# Two NPC Fragments, both from the "Around Campus" subsection:
# confirms the Attributes line's Ability-then-Weakness alphabetizing
# and the "Name Level (detail)" ordering (detail AFTER the level,
# the opposite of every other output format's "Name (detail) Level")
# against two independent examples.

- name: Shady Teacher
  fragment: true
  background: |
    The **Shady Teacher** just joined the faculty and seems to know
    his subject, yet something about him is wrong. Perhaps it's the
    sunglasses he never takes off, even inside -- or the students who
    keep vanishing from his class.
  abilities:
    - name: Art of Invisibility
      level: 2
    - name: Perceptive
      level: 2
    - name: Smart
      level: 3
  weaknesses:
    - name: Absent-Minded
      level: -1
    - name: Fussy
      level: -1
    - name: Quirk
      level: -1
      detail: Always Wears Sunglasses
    - name: Secret
      level: -2
      detail: To Everybody

- name: Snobbish Upperclassman
  fragment: true
  background: |
    The **Snobbish Upperclassman** is top of her class, star of the
    kendo team, and the most popular girl in school, and she's well
    aware of it. Don't expect her to give you the time of day.
  abilities:
    - name: Agile
      level: 2
    - name: Beautiful
      level: 2
    - name: Knowledge
      level: 2
      detail: Kendo
    - name: Minions
      level: 2
      detail: Her Clique
    - name: Quick
      level: 2
    - name: Smart
      level: 2
  weaknesses:
    - name: Arrogant
      level: -2
    - name: Emotionless
      level: -1
    - name: Obsession
      level: -2
      detail: Meeting Her Mother's Lofty Expectations
    - name: Overconfident
      level: -2
    - name: Short-Tempered
      level: -1
