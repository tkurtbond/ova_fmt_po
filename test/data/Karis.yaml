            counts-as: 3
          - Weapon
        description: Her weapon can release a super-strong cable to entangle foes, among other creative uses.
        roll: 6
        dx: 1
        endurance: 0
  fluff:
    concept: Hotheaded Space-Trekking Bounty Hunter
    birthday: March 23
    age: 18
    gender: Female
    height: 5'1"
    weight: 108 lbs.
    hair: Reddish-Pink
    eyes: Green
    association: Galactic Peace Legion Contract
    hobbies: Collecting Stuffed Animals
