      level: -2
  combat:
    defense: 4
    health: 40
    endurance: 40
    threat-value: 14
    attacks:
      - name: Gauntlet Bull
        perks:
          - Stunning
        flaws:
          - Inaccurate
          - Weapon
        description: A fierce punch with speed and power can bowl over even stalwart foes.
        roll: 3
        dx: 6
        endurance: 0
      - name: Gauntlet Bear
        perks:
          - Paralyzing
        flaws:
          - Ineffective
          - Weapon
        description: Natsuki grasps her opponent in her clutches and doesn't let go.
        roll: 4
        dx: 5
        endurance: 0
      - name: Gauntlet Crash
        perks:
          - Area Effect
          - Stunning
        flaws:
          - Ineffective
          - Weapon
        description: Natsuki pounds the ground, sending out a shockwave of destruction all around her.
        roll: 4
        dx: 5
        endurance: 10
      - name: Stiletto Kick
        affinity: Martial Arts
        description: Even without her signature gauntlet, Natsuki proves a formidable fighter.
        roll: 4
        dx: 3
        endurance: 0
  notes:
    - header: Malicron Corporation
      text: |
        As head of a military-technology powerhouse, Natsuki can call
        on a wide range of vehicles, equipment, and arms, and can
        summon trained security officers (armed guards with a modest
        Ranged Attack bonus) to her side at will.
    - header: A Secret Garden
      text: |
        Atop Malicron's headquarters, Natsuki keeps a hidden flower
        garden -- a private sanctuary where she can set aside her
        public persona, known to almost no one.
  fluff:
