---
# Natsuki (OVA rulebook, "Sample Characters" chapter, p. 33-35).
# ova-rulebook.txt lines 1249-1358. See Karis.yaml's header comment
# for the general policy.

- name: Natsuki
  tagline: No one will get in the way of what is rightfully mine!
  summary: A ruthless corporate CEO determined to prove her superiority over every man she meets.
  background: |
    Natsuki fought her way up the corporate ladder at Malicron only
    to find herself treated as a trophy rather than a talent. Once
    she finally seized control of the company, she purged its male
    staff entirely and built a gauntlet capable of enforcing her will
    by force, determined that no man would ever hold power over her
    again.
  personality: |
    Commanding, intimidating, and openly contemptuous of men,
    Natsuki carries herself with an air of intense, calculated
    authority.
  abilities:
    - name: Agile
      level: 2
    - name: Attack
      level: 2
      detail: Iron Fist
    - name: Beautiful
      level: 2
    - name: Intimidating
      level: 2
    - name: Knowledge
      level: 4
      detail: Business
    - name: Knowledge
      level: 2
      detail: Flowers
    - name: Minions
      level: 2
    - name: Position of Power
      level: 3
      detail: Malicron President
    - name: Quick
      level: 2
    - name: Strong
      level: 3
    - name: Wealthy
      level: 5
  weaknesses:
    - name: Arrogant
      level: -2
    - name: Fear
      level: -2
      detail: Being Held Against Will
    - name: Focus
      level: -1
      detail: Strong Requires Gauntlet
    - name: Greedy
      level: -1
    - name: Hatred
      level: -2
      detail: The Y Chromosome
    - name: Infamous
      level: -2
      detail: Ruthless Man-Hater
    - name: Loner
      level: -1
    - name: Obsession
      level: -2
      detail: Proving Her Superiority
    - name: Overconfident
      level: -2
    - name: Quirk
      level: -1
      detail: Obnoxious Laugh
    - name: Short-Tempered
      level: -2
    - name: Soft Spot
      level: -1
      detail: Flowers
