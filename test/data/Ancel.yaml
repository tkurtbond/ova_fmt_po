---
# Ancel (OVA rulebook, "Sample NPCs" chapter, p. 138).
# ova-rulebook.txt lines 6375-6442; the stat block was checked against
# the PDF page, since the text extraction scrambles stacked Levels
# (Soft Spot/Wanted/Weak). See Acacia.yaml's header comment for the
# transcription policy and the new `npc-type` and `character-hooks`
# keys.

- name: Ancel
  npc-type: Heroic
  tagline: It is most unfortunate that you have seen me. Oh well, it can't be helped. Good-bye.
  summary: A twelve-year-old pianist who is secretly a hitman.
  background: |
    Ancel looks like an ordinary twelve-year-old boy, but anyone who
    spends time with him notices something deeper: a composure,
    insight, and self-supporting life as a pianist that don't fit his
    age. Playing piano is only his cover. He's a hitman, equipped with
    every kind of weapon and gadget and very good at the job. Clients
    never meet him, targets never survive him, and his youthful look
    is the ideal disguise. Nobody knows his past.
  character-hooks: |
    Anyone who angers the wrong person might find Ancel sent after
    them, and the PCs might try to stop him finishing a job. Or he
    might just be a friendly face at the local café or bar.
  abilities:
    - name: Agile
      level: 2
    - name: Art of Invisibility
      level: 3
    - name: Attack
      level: 2
      detail: Tools of the Trade
    - name: Combat Expert
      level: 4
    - name: Dimensional Pocket
      level: 3
    - name: Evasive
      level: 2
    - name: Intuitive
      level: 2
    - name: Knowledge
      level: 4
      detail: Piano
    - name: Perceptive
      level: 2
    - name: Quick
      level: 1
    - name: Wealthy
      level: 2
  weaknesses:
    - name: Ageism
      level: -1
    - name: Emotionless
      level: -1
    - name: Frail
      level: -2
    - name: Fussy
      level: -1
    - name: Ineptitude
      level: -2
      detail: Speaking Face-to-Face
    - name: Secret
      level: -3
      detail: Assassin
    - name: Soft Spot
      level: -2
      detail: Music
    - name: Wanted
      level: -3
      detail: The Law
    - name: Weak
      level: -2
  combat:
    defense: 5
    health: 20
    endurance: 40
    threat-value: 14
    attacks:
      - name: Handgun
        perks:
          - Effective
          - Ranged
        flaws:
          - Weapon
        description: Happiness is a warm gun. Well, Ancel never seems to be happy, but close enough.
        roll: 8
        dx: 4
        endurance: 0
      - name: Sniper Rifle
        perks:
          - Impairing
          - Ranged
        flaws:
          - Delayed
          - Weapon
        description: What better way to carry out one's work but from afar and well out of harm's way?
        roll: 8
        dx: 3
        endurance: 0
      - name: Length of Wire
        perks:
          - name: Paralyzing
            counts-as: 2
        flaws:
          - name: Low Penetration
            counts-as: 2
        description: If left without other means, Ancel knows how to improvise to take down a target, even if his small frame makes the effort exhausting.
        roll: 8
        dx: 1
        endurance: 10
...
