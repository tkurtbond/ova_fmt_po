---
# Auren (OVA rulebook, "Sample Characters" chapter, p. 38-39).
# ova-rulebook.txt lines ~1475-1591 (cross-checked against
# OVAPlayerBook-Auren-2015-01-29.pdf, which matches exactly). See
# Karis.yaml's header comment for the general policy.
#
# NOTE: an older, structurally inconsistent `Auren.yaml` already
# exists in the *old* Scheme project's test-data
# (~/current/RPG/Tools/OVA/test-data/Auren.yaml -- has key typos like
# `abilty:`/`lebel:`, see PLAN.md §6). This file is an independent,
# from-scratch transcription for *this* repo, not a fix-up of that one.
#
# Introduces the Magic-spell schema (PLAN.md §2.2's resolved
# understanding: a spell has no Level of its own -- it grants access,
# at that Ability's own Level, to an Ability the caster already has
# (not a copy/imitation of it -- it IS that Ability, just reached
# through Magic instead of bought directly), with an Endurance cost
# looked up from a table keyed on (that Ability's Level, caster's
# Magic Level)). Represented here as a `spells:` list under the Magic
# ability item -- deliberately a different shape from Transformation/
# Companion's `abilities:`/`weaknesses:` nesting (Fukiko.yaml,
# Karis.yaml), since a spell isn't itself an Ability/Weakness the way
# Transformation's/Companion's granted items are: each spell entry is
# `{name, ability, level, endurance}` (flavor name, the Ability it
# grants access to, that Ability's Level, and the Endurance cost).
# Mana Shield's
# "10+ Endurance" (a "+" suffix, apparently an open-ended/variable
# cost -- Barrier itself can cost more to maintain, per its own rules
# text) is kept as the string "10+" rather than forced into a plain
# integer, same treatment as `combat.defense`'s non-integer "4/5".

- name: Auren
  tagline: It is my duty to protect this world, even if its future makes me doubt why I should bother…
  summary: A centuries-old sorcerer, accidentally de-aged and stranded in the wrong era while investigating a dark omen.
  background: |
    A young but gifted sorcerer of the secretive Order of the Fallen
    Star, Auren volunteered to use forbidden Time Magic to
    investigate a dire omen glimpsed by the Order's seer. The spell
    stranded him in 21st-century Japan and left him with the body of
    a teenager, unable to reverse the effect. With no way home, Auren
    has resolved to hunt down whatever threat he was sent to find.
  personality: |
    Serious and stubborn, Auren struggles with the indignity of being
    treated as a mere teenager despite his true age, and often acts
    with an old-fashioned sense of authority he hasn't earned in this
    era. He's awkward around women and, for reasons of his own,
    deeply distrustful of animals.
  abilities:
    - name: Armored
      level: 1
      detail: Medieval Armor
    - name: Attack
      level: 3
      detail: Sword & Sorcery
    - name: Combat Expert
      level: 3
    - name: Evasive
      level: 2
    - name: Knowledge
      level: 4
      detail: Magic
    - name: Magic, Arcane
      level: 3
      spells:
        - name: Mana Shield
          ability: Barrier
          level: 2
          endurance: "10+"
        - name: Wings of Dezantis
          ability: Flight
          level: 2
          endurance: 10
        - name: Feeblemind
          ability: Intimidating
          level: 2
          endurance: 10
        - name: Breath
          ability: Life Support
          level: 2
          endurance: 10
        - name: Hasten
          ability: Quick
          level: 3
          endurance: 20
        - name: Atlas Arm
          ability: Strong
          level: 3
          endurance: 20
    - name: Smart
      level: 2
    - name: Vigorous
      level: 2
  weaknesses:
    - name: Ageism
      level: -1
    - name: Arrogant
      level: -1
    - name: Code of Conduct
      level: -1
      detail: Protecting Women… Begrudgingly
    - name: Easily Distracted
      level: -2
    - name: Hatred
      level: -1
      detail: Animals
    - name: Ineptitude
      level: -3
      detail: Modern Technology
    - name: Quirk
      level: -1
      detail: Antiquated Language
    - name: Quirk
      level: -2
      detail: Stranger in a Strange Land
    - name: Stubborn
      level: -2
  combat:
    defense: 4
    health: 40
    endurance: 60
    threat-value: 18
    attacks:
      - name: Orion
        perks:
          - Armor Piercing
        flaws:
          - Weapon
        description: Auren's sword, crafted from unbreakable adamantite, is as beautiful as it is deadly.
        roll: 5
        dx: 4
        endurance: 0
      - name: Fireball
        perks:
          - Continued Effect
          - name: Effective
            counts-as: 2
          - Ranged
        affinity: Fire
        description: Auren sends forth a spiralling blast of flame. Its magic continues to burn after it hits.
        roll: 5
        dx: 6
        endurance: 20
      - name: Ice Spire Array
        perks:
          - Area Effect
          - Armor Piercing
          - Overwhelming
          - Ranged
        affinity: Ice
        flaws:
          - Feather Blow
          - Ineffective
        description: A prismatic array of frozen shards bombards multiple enemies, piercing any defenses.
        roll: 5
        dx: 3
        endurance: 20
      - name: Thunder Godspell
        perks:
          - name: Accurate
            counts-as: 2
          - Effective
          - Ranged
          - Stunning
        affinity: Lightning
        flaws:
          - Delayed
        description: Auren summons a bolt of electrical energy that stuns its target. It rarely misses.
        roll: 7
        dx: 5
        endurance: 20
  fluff:
    concept: Time Skipping Sorcerer
    birthday: June 24
    age: 44 (Appears 16)
    gender: Male
    height: 5'10"
    weight: 152 lbs.
    hair: Grey-Blue
    eyes: Grey
    association: Order of the Fallen Star
    hobbies: Fencing
    favorite-food: Mutton
    allies: None
    enemies: Mysterious Evil from the Future
...
