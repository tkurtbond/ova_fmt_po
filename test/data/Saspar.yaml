---
# Saspar (OVA rulebook, "Sample NPCs" chapter, p. 135).
# ova-rulebook.txt lines 6186-6244. See Acacia.yaml's header comment
# for the transcription policy and the new `npc-type` and
# `character-hooks` keys. The Character Hooks paragraph covers both
# Saspar and Acacia.

- name: Saspar
  npc-type: Heroic
  tagline: Time, unstoppable time … when will my time come to an end?
  summary: A blindfolded gunman of the Order of Chaos who secretly longs to fail.
  background: |
    Saspar looks like a cold servant of the Order of Chaos, but
    underneath he simply doesn't care whether he lives; he quietly
    hopes to fail at his work and so be done with existence. His
    magic comes from strange enchanted devices rather than study: a
    gun that fires spells once loaded with the right bullet, and an
    ornate pocket watch that lets him foresee events and head off
    danger. He always wears a red sash over his eyes, and nobody
    knows whether he's truly blind.
  character-hooks: |
    The Order of Chaos makes Saspar and Acacia natural enemies for
    anyone defending the world from evil -- Fukiko and Auren, whose
    backgrounds both feature a vague darkness to be fought, fit
    especially well. They can also serve as magical rivals.
  abilities:
    - name: Art of Invisibility
      level: 3
    - name: Attack
      level: 3
      detail: Magic Gun
    - name: Combat Expert
      level: 3
    - name: Knowledge
      level: 4
      detail: Violin
    - name: Quick
      level: 3
    - name: Sixth Sense
      level: 3
  weaknesses:
    - name: Emotionless
      level: -2
    - name: Focus
      level: -1
      detail: Chronos Watch
    - name: Hatred
      level: -2
      detail: Excessive Noise
    - name: Servitude
      level: -3
      detail: Chaos
    - name: Unique Weakness
      level: -2
      detail: Cannot Detect Things Perceptible to Sight Alone
    - name: Vulnerability
      level: -1
      detail: Holy
  combat:
    defense: 5
    health: 40
    endurance: 40
    threat-value: 14
    attacks:
      - name: Brim Shot
        perks:
          - name: Accurate
            counts-as: 2
          - Effective
          - Ranged
        affinity: Fire
        flaws:
          - Activation
          - Weapon
        description: Calls on the spirit of Phoenix to fire a homing projectile bathed in fire.
        roll: 7
        dx: 5
        endurance: 0
      - name: Ise Shot
        perks:
          - Effective
          - Impairing
          - Ranged
        affinity: Ice
        flaws:
          - Activation
          - Weapon
        description: Calls on the spirit of Ymir to fire a frost ray that encapsulates what it hits in ice.
        roll: 5
        dx: 5
        endurance: 0
      - name: Lode Shot
        perks:
          - Effective
          - Ranged
          - Stunning
        affinity: Earth
        flaws:
          - Activation
          - Weapon
        description: Calls on the spirit of Gaia to fire a rocky blast that knocks targets off their feet.
        roll: 5
        dx: 5
        endurance: 0
...
