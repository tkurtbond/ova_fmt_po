# npc-type: Boss (rulebook p. 123): the fourth type. Boss Abilities are
# ordinary abilities: entries in the list, each with a level, as the
# format requires of every ability. The second is a group, for the plural.
- name: The Warden
  npc-type: Boss
  abilities:
    - name: Attack
      level: 2
      detail: Shock baton
    - name: Escape Plan
      level: 1
      detail: A capsule under the desk
    - name: Health Reserve
      level: 1
    - name: Scale Advantage
      level: 1
      detail: Attack
  weaknesses:
    - name: Arrogant
      level: -1
  combat:
    health: 40
    endurance: 40
    defense: 2
    threat-value: 22
    attacks:
      - name: Shock baton
        flaws:
          - Weapon
        roll: 2
        dx: 3
        endurance: 0
- name: Twin Wardens
  npc-type: boss
  count: 2
  abilities:
    - name: Extra Actions
      level: 1
  combat:
    health: 40
    endurance: 40
    defense: 2
    threat-value: 10
