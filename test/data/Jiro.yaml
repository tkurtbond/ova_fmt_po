---
# Jiro (OVA rulebook, "Sample NPCs" chapter, p. 141).
# ova-rulebook.txt lines 6560-6622; the stat block was checked against
# the PDF page, since the text extraction scrambles stacked Levels
# (Combat Expert/Evasive/Intimidating). See Acacia.yaml's header
# comment for the transcription policy and the new `npc-type` and
# `character-hooks` keys.

- name: Jiro
  npc-type: Secondary
  tagline: Break? There's no time for a break! If you want a break, I'll give it to you -- a break in the neck!
  summary: The local police captain, chronically overworked and much too quick to draw his gun.
  background: |
    As the local police captain, Jiro keeps the force running, and
    the strain shows: he's jumpy, irritable, and always juggling
    several unrelated jobs at once, sometimes answering phones,
    barking orders, and doing paperwork all at the same time. His
    colleagues keep urging him to take time off, but he's never
    missed a day, and some suspect he's been saving up vacation for
    decades. Whether from stress or something darker, he tends to aim
    his gun at anything he considers an unwanted intrusion.
  character-hooks: |
    For all his near-psychotic devotion to the job, Captain Jiro
    generally does it well. Still, even well-behaved PCs can find
    themselves under police scrutiny.
  abilities:
    - name: Armored
      level: 1
      detail: Bulletproof Vest
    - name: Attack
      level: 1
      detail: Police Training
    - name: Combat Expert
      level: 2
    - name: Evasive
      level: 1
    - name: Intimidating
      level: 2
    - name: Minions
      level: 3
      detail: Officers
    - name: Perceptive
      level: 1
    - name: Position of Power
      level: 2
    - name: Strong
      level: 2
    - name: Tough
      level: 1
  weaknesses:
    - name: Compulsion
      level: -2
      detail: Trigger-Happy
    - name: Dependency
      level: -1
      detail: Coffee
    - name: Jittery
      level: -2
    - name: Obsession
      level: -3
      detail: Work
    - name: Servitude
      level: -2
      detail: Police Force
    - name: Short-Tempered
      level: -3
    - name: Stubborn
      level: -1
  combat:
    defense: 3
    health: 30
    endurance: 20
    threat-value: 9
    attacks:
      - name: Desk-Side Revolver
        perks:
          - name: Effective
            counts-as: 2
          - Ranged
        flaws:
          - Ammunition
          - Weapon
        description: Jiro's constant companion and likely only friend.
        roll: 4
        dx: 4
        endurance: 0
      - name: Bare Knuckle
        perks:
          - Stunning
        flaws:
          - Inaccurate
        description: While he prefers "civilized" weaponry like his revolver, Jiro can throw a mean punch.
        roll: 3
        dx: 4
        endurance: 5
...
